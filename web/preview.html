<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Job Hunter - Vista Previa Local</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: '#0f172a',
            foreground: '#f8fafc',
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #020617; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="min-h-screen">

  <div id="app" class="mx-auto min-h-screen max-w-md pb-24 text-slate-100">
    <!-- El contenido se inyecta dinámicamente con JavaScript -->
  </div>

  <script>
    const SUPABASE_URL = "https://mietblpwonqlrzbriblt.supabase.co";
    const SUPABASE_KEY = "sb_publishable_xmgnEOMqKEi5fMeepZw9VA_nZVT19PP";
    const APP_PIN = "1234";

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let state = {
      isAuthenticated: localStorage.getItem("job_hunter_auth") === "true",
      activeTab: "new",
      selectedSource: "all",
      jobs: [],
      loading: true,
      previewJob: null,
      pinInput: "",
      pinError: false
    };

    function render() {
      const app = document.getElementById("app");

      if (!state.isAuthenticated) {
        app.innerHTML = `
          <div class="flex min-h-screen items-center justify-center p-4">
            <div class="w-full max-w-sm rounded-2xl border border-slate-800 bg-slate-900/90 p-8 shadow-2xl backdrop-blur-xl">
              <div class="flex flex-col items-center text-center">
                <div class="flex h-14 w-14 items-center justify-center rounded-2xl bg-emerald-500/10 text-emerald-400 text-2xl font-bold">
                  🔒
                </div>
                <h1 class="mt-4 text-2xl font-bold text-white">Job Hunter Bot</h1>
                <p class="mt-1 text-xs text-slate-400">Ingresa tu PIN de acceso (1234)</p>
              </div>

              <form onsubmit="handlePinSubmit(event)" class="mt-6 space-y-4">
                <input
                  type="password"
                  id="pinInput"
                  inputmode="numeric"
                  maxlength="6"
                  placeholder="PIN"
                  value="${state.pinInput}"
                  class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-center text-2xl tracking-widest text-white focus:border-emerald-500 focus:outline-none"
                  autofocus
                />
                ${state.pinError ? '<p class="text-center text-xs text-rose-400 font-medium">PIN incorrecto.</p>' : ''}
                <button type="submit" class="w-full rounded-xl bg-emerald-500 py-3 font-semibold text-slate-950 hover:bg-emerald-400 transition">
                  Desbloquear
                </button>
              </form>
            </div>
          </div>
        `;
        return;
      }

      const countNew = state.jobs.filter(j => j.status === 'new').length;
      const countApplied = state.jobs.filter(j => j.status === 'applied').length;
      const countDiscarded = state.jobs.filter(j => j.status === 'discarded').length;

      const filteredJobs = state.jobs.filter(j => {
        const matchesTab = j.status === state.activeTab;
        const matchesSource = state.selectedSource === "all" || j.source.toLowerCase() === state.selectedSource.toLowerCase();
        return matchesTab && matchesSource;
      });

      app.innerHTML = `
        <!-- HEADER -->
        <header class="sticky top-0 z-30 border-b border-slate-800/80 bg-slate-950/80 px-4 py-3 backdrop-blur-md">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-emerald-500/10 text-emerald-400 font-bold">
                💼
              </div>
              <div>
                <h1 class="text-base font-bold text-white leading-none">Job Hunter</h1>
                <div class="flex items-center gap-1.5 mt-1">
                  <span class="h-1.5 w-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                  <span class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">En tiempo real</span>
                </div>
              </div>
            </div>
            <button onclick="fetchJobs()" class="flex h-8 w-8 items-center justify-center rounded-lg border border-slate-800 bg-slate-900 text-slate-300 hover:text-white">
              🔄
            </button>
          </div>

          <!-- FILTRO FUENTE -->
          <div class="mt-3 flex gap-1.5 overflow-x-auto pb-1 text-xs">
            ${["all", "computrabajo", "bumeran", "indeed", "zonajobs"].map(src => `
              <button onclick="setSource('${src}')" class="rounded-full px-3 py-1 font-medium capitalize transition ${
                state.selectedSource === src ? "bg-slate-200 text-slate-950" : "bg-slate-900 text-slate-400 border border-slate-800"
              }">
                ${src === 'all' ? 'Todas' : src}
              </button>
            `).join('')}
          </div>
        </header>

        <!-- TABS ESTADO -->
        <div class="flex border-b border-slate-800/80 bg-slate-900/40 px-2 text-xs font-semibold">
          <button onclick="setTab('new')" class="flex-1 border-b-2 py-3 text-center transition ${state.activeTab === 'new' ? 'border-emerald-500 text-emerald-400' : 'border-transparent text-slate-400'}">
            🔥 Nuevas (${countNew})
          </button>
          <button onclick="setTab('applied')" class="flex-1 border-b-2 py-3 text-center transition ${state.activeTab === 'applied' ? 'border-emerald-500 text-emerald-400' : 'border-transparent text-slate-400'}">
            ✅ Postuladas (${countApplied})
          </button>
          <button onclick="setTab('discarded')" class="flex-1 border-b-2 py-3 text-center transition ${state.activeTab === 'discarded' ? 'border-emerald-500 text-emerald-400' : 'border-transparent text-slate-400'}">
            🗑️ Descartadas (${countDiscarded})
          </button>
        </div>

        <!-- LISTA -->
        <section class="p-4 space-y-3">
          ${state.loading ? `
            <div class="py-16 text-center text-xs text-slate-500">Cargando oportunidades...</div>
          ` : filteredJobs.length === 0 ? `
            <div class="rounded-2xl border border-dashed border-slate-800 py-16 text-center text-slate-500">
              <p class="text-sm font-medium text-slate-400">No hay ofertas en esta sección</p>
              <p class="text-xs text-slate-500 mt-1">El scraper sincronizará las novedades en su próxima corrida.</p>
            </div>
          ` : filteredJobs.map(job => {
            const src = (job.source || '').toLowerCase();
            const badgeClass = src === 'computrabajo'
              ? 'bg-amber-500/10 text-amber-400 border border-amber-500/20'
              : src === 'bumeran'
              ? 'bg-fuchsia-500/10 text-fuchsia-400 border border-fuchsia-500/20'
              : src === 'indeed'
              ? 'bg-blue-500/10 text-blue-400 border border-blue-500/20'
              : src === 'zonajobs'
              ? 'bg-rose-500/10 text-rose-400 border border-rose-500/20'
              : 'bg-slate-500/10 text-slate-400 border border-slate-500/20';
            return `
            <article class="rounded-2xl border border-slate-800/80 bg-slate-900/60 p-4 shadow-sm backdrop-blur-sm">
              <div class="flex items-center justify-between text-[11px] mb-2">
                <span class="rounded px-2 py-0.5 font-semibold uppercase tracking-wider ${badgeClass}">
                  ${job.source}
                </span>
                <span class="text-slate-400">${job.published_time_text}</span>
              </div>
              <h2 class="text-base font-bold text-white line-clamp-2">${job.title}</h2>
              <div class="mt-2 text-xs text-slate-400 space-y-0.5">
                <p class="text-slate-300 font-medium">🏢 ${job.company}</p>
                <p>📍 ${job.location}</p>
              </div>

              <div class="mt-4 flex items-center gap-2 pt-3 border-t border-slate-800/60">
                <button onclick="openPreview('${job.id}')" class="flex-1 rounded-xl border border-slate-700 bg-slate-800 py-2.5 text-xs font-semibold text-slate-200 hover:bg-slate-700">
                  👁️ Vista Previa
                </button>
                ${job.status === 'new' ? `
                  <a href="${job.url}" target="_blank" onclick="updateStatus('${job.id}', 'applied')" class="flex-1 rounded-xl bg-emerald-500 py-2.5 text-xs font-semibold text-slate-950 text-center hover:bg-emerald-400">
                    🔗 Postularme
                  </a>
                  <button onclick="updateStatus('${job.id}', 'discarded')" class="h-9 w-9 rounded-xl border border-slate-800 bg-slate-800/50 text-slate-400 hover:text-rose-400">
                    🗑️
                  </button>
                ` : job.status === 'applied' ? `
                  <a href="${job.url}" target="_blank" class="flex-1 rounded-xl bg-emerald-500/10 border border-emerald-500/30 py-2.5 text-xs font-semibold text-emerald-400 text-center">
                    ✅ Ver aviso oficial
                  </a>
                ` : `
                  <button onclick="updateStatus('${job.id}', 'applied')" class="flex-1 rounded-xl border border-slate-700 bg-slate-800 py-2.5 text-xs text-slate-300">
                    Restaurar
                  </button>
                `}
              </div>
            </article>
          `;}).join('')}
        </section>

        <!-- MODAL VISTA PREVIA -->
        ${state.previewJob ? `
          <div class="fixed inset-0 z-50 flex items-end justify-center bg-black/70 backdrop-blur-sm p-0 sm:items-center sm:p-4">
            <div class="w-full max-w-lg rounded-t-3xl sm:rounded-2xl border border-slate-800 bg-slate-900 p-6 shadow-2xl max-h-[85vh] flex flex-col">
              <div class="flex items-start justify-between border-b border-slate-800 pb-3">
                <div>
                  <span class="rounded px-2 py-0.5 text-[10px] font-semibold uppercase tracking-wider ${
                    (state.previewJob.source || '').toLowerCase() === 'computrabajo'
                      ? 'bg-amber-500/10 text-amber-400 border border-amber-500/20'
                      : (state.previewJob.source || '').toLowerCase() === 'bumeran'
                      ? 'bg-fuchsia-500/10 text-fuchsia-400 border border-fuchsia-500/20'
                      : (state.previewJob.source || '').toLowerCase() === 'indeed'
                      ? 'bg-blue-500/10 text-blue-400 border border-blue-500/20'
                      : 'bg-rose-500/10 text-rose-400 border border-rose-500/20'
                  }">
                    ${state.previewJob.source}
                  </span>
                  <h2 class="mt-1 text-base font-bold text-white">${state.previewJob.title}</h2>
                  <p class="text-xs text-slate-400 mt-0.5">${state.previewJob.company} • ${state.previewJob.location}</p>
                </div>
                <button onclick="closePreview()" class="h-7 w-7 rounded-full bg-slate-800 text-slate-400 text-sm">✕</button>
              </div>
              <div class="my-4 overflow-y-auto text-xs text-slate-300 space-y-3">
                <div class="rounded-xl bg-slate-950 p-4 border border-slate-800">
                  <h3 class="font-semibold text-slate-200 mb-2">Resumen del puesto:</h3>
                  <p class="whitespace-pre-wrap">${state.previewJob.full_description || "Sin descripción disponible."}</p>
                </div>
                <p class="text-slate-400 text-[11px]">⏱️ Publicado: ${state.previewJob.published_time_text}</p>
              </div>
              <div class="pt-3 border-t border-slate-800 flex gap-2">
                <a href="${state.previewJob.url}" target="_blank" onclick="updateStatus('${state.previewJob.id}', 'applied')" class="flex-1 rounded-xl bg-emerald-500 py-3 text-center text-xs font-bold text-slate-950 hover:bg-emerald-400 capitalize">
                  Ir a Postularme en ${state.previewJob.source}
                </a>
                ${state.previewJob.status === 'new' ? `
                  <button onclick="updateStatus('${state.previewJob.id}', 'discarded')" class="rounded-xl border border-slate-700 bg-slate-800 px-4 text-xs font-semibold text-slate-300">
                    Descartar
                  </button>
                ` : ''}
              </div>
            </div>
          </div>
        ` : ''}
      `;
    }

    function handlePinSubmit(e) {
      e.preventDefault();
      const input = document.getElementById("pinInput").value;
      if (input === APP_PIN) {
        localStorage.setItem("job_hunter_auth", "true");
        state.isAuthenticated = true;
        state.pinError = false;
        render();
        fetchJobs();
      } else {
        state.pinError = true;
        state.pinInput = "";
        render();
      }
    }

    async function fetchJobs() {
      state.loading = true;
      render();
      try {
        const { data, error } = await supabaseClient
          .from("jobs")
          .select("*")
          .order("created_at", { ascending: false });
        if (error) throw error;
        state.jobs = data || [];
      } catch (err) {
        console.error("Error al cargar:", err);
      } finally {
        state.loading = false;
        render();
      }
    }

    async function updateStatus(jobId, newStatus) {
      state.jobs = state.jobs.map(j => j.id === jobId ? { ...j, status: newStatus } : j);
      if (state.previewJob && state.previewJob.id === jobId) {
        state.previewJob = null;
      }
      render();
      try {
        await supabaseClient
          .from("jobs")
          .update({ status: newStatus, status_updated_at: new Date().toISOString() })
          .eq("id", jobId);
      } catch (e) {
        console.error(e);
        fetchJobs();
      }
    }

    function setTab(tab) {
      state.activeTab = tab;
      render();
    }

    function setSource(src) {
      state.selectedSource = src;
      render();
    }

    function openPreview(id) {
      state.previewJob = state.jobs.find(j => j.id === id) || null;
      render();
    }

    function closePreview() {
      state.previewJob = null;
      render();
    }

    // Inicializar
    render();
    if (state.isAuthenticated) {
      fetchJobs();
    }
  </script>
</body>
</html>
